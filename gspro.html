<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="no">
  <title>GSPro</title>
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background: #0f0f0f;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      color: #fff;
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 164.7vw;
      height: 164.7vh;
      overflow: hidden;
      background: #0f0f0f;
      transform: scale(0.6075);
      transform-origin: top left;
    }

    @media screen and (orientation: portrait) {
      #app {
        width: 164.7vh;
        height: 164.7vw;
        top: 50%;
        left: 50%;
        right: auto;
        bottom: auto;
        transform: translate(-50%, -50%) rotate(90deg) scale(0.6075);
        transform-origin: center center;
      }

      .page {
        width: 100vh;
        height: 100vw;
      }
    }

    #portrait-warning {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0f0f0f;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 40px;
    }

    #portrait-warning svg {
      opacity: 0.6;
      animation: rotateHint 2s ease-in-out infinite;
    }

    @keyframes rotateHint {
      0% {
        transform: rotate(0deg);
      }

      40% {
        transform: rotate(90deg);
      }

      60% {
        transform: rotate(90deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    .page {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #0f0f0f;
    }

    .page.active {
      display: flex;
    }

    #connIndicator {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 28px;
      font-weight: 700;
      background: #1a1a1a;
      border: 2px solid #333;
      cursor: pointer;
    }

    #connDot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    #connDot.connected {
      background: #1D9E75;
      box-shadow: 0 0 10px #1D9E75;
    }

    #connDot.disconnected {
      background: #E24B4A;
      animation: blink 1s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }
    }

    #connLabel.connected {
      color: #1D9E75;
    }

    #connLabel.disconnected {
      color: #E24B4A;
    }

    .page-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 0 0 10px 0;
    }

    .back-arrow {
      width: 208px;
      height: 82px;
      cursor: pointer;
    }

    .back-arrow:active {
      opacity: 0.7;
      transform: scale(0.93);
    }

    .welcome-subtitle {
      font-size: 18px;
      color: #888;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .welcome-title {
      font-size: 56px;
      font-weight: 300;
      text-align: center;
    }

    .welcome-title span {
      color: #EF9F27;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
      justify-content: center;
      width: 100%;
      max-width: 1964px;
      margin-top: 40px;
    }

    .welcome-btn,
    .conn-btn {
      padding: 28px 0;
      text-align: center;
      cursor: pointer;
      font-size: 22px;
      font-weight: 700;
      background: #185FA5;
      color: #fff;
      border-top: 2px solid #85B7EB;
      border-left: 2px solid #85B7EB;
      border-right: 2px solid #042C53;
      border-bottom: 4px solid #042C53;
      border-radius: 14px;
      transition: transform 0.08s;
    }

    .welcome-btn {
      font-size: 60px;
    }

    #page-welcome .welcome-btn {
      min-height: 220px;
      height: 220px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.06;
    }

    .welcome-placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-btn:active,
    .conn-btn:active {
      transform: translateY(2px);
    }

    .quit-btn {
      background: #c0392b;
      color: #fff;
      border-top: 2px solid #e74c3c;
      border-right: 2px solid #7b241c;
      border-bottom: 4px solid #7b241c;
    }

    .scan-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 450px;
    }

    .scan-status-pill {
      padding: 24px 48px;
      border-radius: 14px;
      font-size: 36px;
      font-weight: 700;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .scan-status-pill.not-connected {
      background: #2a1a1a;
      border: 2px solid #E24B4A;
      color: #E24B4A;
    }

    .scan-status-pill.connected {
      background: #0d2a1e;
      border: 2px solid #1D9E75;
      color: #1D9E75;
    }

    #videoContainer {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 300px;
      border: 2px solid #7F77DD;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      display: none;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #scanCanvas {
      display: none;
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #7F77DD;
      animation: scanAnim 2s linear infinite;
    }

    @keyframes scanAnim {
      0% {
        top: 0;
      }

      100% {
        top: 100%;
      }
    }

    #scanMsg {
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      text-align: center;
    }

    #manualIP {
      background: #1a1a1a;
      border: 2px solid #7F77DD;
      border-radius: 12px;
      padding: 30px;
      font-size: 40px;
      color: #fff;
      width: 100%;
      text-align: center;
    }

    /* BAG MAPPING SPECIFIC STYLES */
    .bagmap-layout {
      display: flex;
      flex-direction: row;
      gap: 16px;
      justify-content: flex-start;
      padding-left: 40px;
      align-items: flex-start;
      flex-wrap: nowrap;
      width: 100%;
    }

    .club-panel {
      width: auto;
      flex: 0 0 auto;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bag-club-grid {
      display: grid;
      grid-template-columns: repeat(6, 162px);
      gap: 10px;
      width: fit-content;
    }

    .bag-club-btn {
      width: 162px;
      height: 162px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      font-size: 50px;
      font-weight: 700;
      color: #fff;
      background: #185FA5;
      border-top: 2px solid #85B7EB;
      border-left: 2px solid #85B7EB;
      border-right: 2px solid #042C53;
      border-bottom: 4px solid #042C53;
      border-radius: 10px;
      user-select: none;
      transition: transform 0.08s;
      box-sizing: border-box;
      font-family: -apple-system, 'Segoe UI', sans-serif;
    }

    .bag-club-btn:active {
      transform: translateY(2px);
    }

    .bag-club-btn.selected {
      background: #7F77DD;
      color: #fff;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3), 0 0 0 2px #afa9ec;
    }

    .putter-club-btn {
      grid-column: span 2;
      width: auto;
    }

    .bag-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 830px;
      min-width: 0;
      gap: 28px;
      position: relative;
    }

    .golf-bag {
      width: 100%;
      max-width: 830px;
      background: #1a1a2e;
      border: 4px solid #444;
      border-radius: 90px 90px 72px 72px;
      padding: 36px 43px;
    }

    .slot-row {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
    }

    .slot {
      border: 3px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 47px;
      font-weight: 700;
      border-radius: 18px;
      height: 118px;
      flex: 1;
      background: #1e1e30;
      color: #d4d4d4;
      cursor: pointer;
    }

    .slot.assigned {
      background: #1D9E75;
      color: #fff;
    }

    .slot.next-slot {
      outline: 4px solid #EF9F27;
    }

    .cs-slot.cs-selected {
      background: #7F77DD !important;
      color: #fff;
      outline: 4px solid #afa9ec;
    }

    .club-display-area {
      display: flex;
      justify-content: space-between;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px 15px;
      width: 100%;
      max-width: 680px;
      align-items: center;
    }

    .bag-selected-indicator {
      grid-column: span 4;
      height: 162px;
      max-width: none;
      padding: 0 20px;
      border-color: #7F77DD;
    }

    .bag-selected-indicator .club-display-text {
      font-size: 50px;
    }

    .bag-selected-indicator .backspace-btn {
      flex: 0 0 auto;
      padding: 8px 20px;
      font-size: 40px;
    }

    .club-display-text {
      font-size: 32px;
      font-weight: 700;
      color: #EF9F27;
    }

    .backspace-btn {
      background: #1a1a1a;
      padding: 5px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 28px;
      color: #888;
    }

    .bag-action-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .bag-action-btn {
      height: 162px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      font-size: 50px;
      font-weight: 700;
      color: #fff;
      background: #185FA5;
      border-top: 2px solid #85B7EB;
      border-left: 2px solid #85B7EB;
      border-right: 2px solid #042C53;
      border-bottom: 4px solid #042C53;
      border-radius: 10px;
      user-select: none;
      box-sizing: border-box;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      transition: transform 0.08s;
    }

    .bag-action-btn:active {
      transform: translateY(2px);
    }

    .bag-action-clear,
    .bag-action-apply,
    .bag-action-save {
      background: #185FA5;
      border-top: 2px solid #85B7EB;
      border-left: 2px solid #85B7EB;
      border-right: 2px solid #042C53;
      border-bottom: 4px solid #042C53;
    }

    .bag-club-grid .bag-action-btn {
      grid-column: span 2;
    }

    .welcome-btn:not(.quit-btn),
    .conn-btn,
    .bag-club-btn,
    .bag-action-btn,
    .arrow-btn-left,
    .arrow-btn-right,
    .gp-btn,
    .gp-gray,
    .gp-empty,
    .bag-action-clear,
    .bag-action-apply,
    .bag-action-save,
    .bag-club-btn.selected {
      color: #fff;
      background: #185FA5;
      border-top: 2px solid #85B7EB;
      border-left: 2px solid #85B7EB;
      border-right: 2px solid #042C53;
      border-bottom: 4px solid #042C53;
    }

    /* GAME PLAY BUTTONS */
    .gp-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .gp-btn {
      padding: 22px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 25px;
      font-weight: 700;
      border-radius: 14px;
      user-select: none;
      transition: transform 0.08s;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      box-sizing: border-box;
      width: 100%;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gp-btn:active {
      transform: translateY(2px);
    }

    .gp-gray {
      color: #fff;
      background: #185FA5;
      border-top: 2px solid #85B7EB;
      border-left: 2px solid #85B7EB;
      border-right: 2px solid #042C53;
      border-bottom: 4px solid #042C53;
    }

    .gp-blue {
      color: #fff;
      background: #185FA5;
      border-top: 2px solid #85B7EB;
      border-left: 2px solid #85B7EB;
      border-right: 2px solid #042C53;
      border-bottom: 4px solid #042C53;
    }

    .gp-empty {
      background: transparent;
      cursor: default;
      border: 1px dashed #222;
      min-height: auto;
      padding: 22px 6px;
    }

    .gp-empty:active {
      transform: none;
    }

    #page-gameplay .gp-btn,
    #page-camera .gp-btn {
      padding-top: 58px;
      padding-bottom: 58px;
      line-height: 1.02;
      white-space: normal;
      overflow-wrap: anywhere;
      text-overflow: clip;
    }

    /* Putter page arrow buttons */
    .arrow-btn-left,
    .arrow-btn-right {
      padding: 22px 6px;
      text-align: center;
      font-size: 25px;
      font-weight: 700;
      border-radius: 14px;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s;
      background: #185FA5;
      color: #fff;
      border-top: 2px solid #85B7EB;
      border-left: 2px solid #85B7EB;
      border-right: 2px solid #042C53;
      border-bottom: 4px solid #042C53;
    }

    .arrow-btn-left {
      clip-path: polygon(12% 0%, 100% 0%, 100% 100%, 12% 100%, 0% 50%);
      padding-left: 45px;
    }

    .arrow-btn-right {
      clip-path: polygon(0% 0%, 88% 0%, 100% 50%, 88% 100%, 0% 100%);
      padding-right: 45px;
    }

    .arrow-btn-left:active,
    .arrow-btn-right:active {
      transform: translateY(2px);
    }

    .club-selection-wrapper {
      display: flex;
      flex-direction: row;
      gap: 24px;
      flex-wrap: wrap;
      width: 100%;
    }

    .club-selection-left {
      flex: 1;
      min-width: 300px;
      background: #0f0f14;
      border-radius: 28px;
      padding: 20px;
      border: 1px solid #2a2a3a;
    }

    .club-selection-right {
      flex: 1;
      min-width: 300px;
      position: relative;
    }

    .club-display-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .club-display-card {
      background: #0f0f0f;
      border: 2px solid #7F77DD;
      border-radius: 24px;
      padding: 22px;
      text-align: center;
      font-size: 56px;
      font-weight: 800;
      color: #EF9F27;
      margin-bottom: 0;
      flex: 1 1 50%;
      min-width: 180px;
      max-width: 50%;
    }

    .club-action-card {
      flex: 0 0 auto;
      min-width: 160px;
    }

    .club-action-row {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }

    .club-info-text {
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      text-align: center;
      background: #1a1a22;
      padding: 18px;
      border-radius: 20px;
    }

    .hud-layout {
      display: grid;
      grid-template-columns: 1fr 3fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .hudTouchpad {
      background: #1a1a2e;
      border: 2px solid #7F77DD;
      border-radius: 14px;
      min-height: 700px;
      position: relative;
      cursor: crosshair;
    }

    .hudCursor {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #EF9F27;
      border: 2px solid #fff;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .hud-instruction {
      text-align: center;
      background: #1a1a2e;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .hud-instruction span {
      font-size: 24px;
      font-weight: 700;
    }

    .putter-arrow {
      min-height: auto;
    }

    .page:not(#page-welcome) .gp-btn,
    .page:not(#page-welcome) .conn-btn,
    .page:not(#page-welcome) .arrow-btn-left,
    .page:not(#page-welcome) .arrow-btn-right {
      min-height: 220px;
      height: 220px;
      padding: 0 10px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      line-height: 1.08;
      white-space: normal;
      overflow-wrap: anywhere;
      text-overflow: clip;
    }

    #page-clubselection .gp-btn,
    #page-practiceclubselection .gp-btn {
      min-height: 140px;
      height: 140px;
      font-size: 42px;
    }

    #page-rangefinder .gp-btn {
      min-height: 140px;
      height: 140px;
      font-size: 42px;
    }

    .practice-layout {
      display: grid;
      grid-template-columns: 1fr 3fr 1fr;
      gap: 12px;
      width: 100%;
      align-items: start;
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="portrait-warning">
      <svg width="90" height="90" viewBox="0 0 80 80">
        <rect x="20" y="8" width="40" height="64" rx="6" stroke="#EF9F27" stroke-width="3" />
        <circle cx="40" cy="62" r="3" fill="#EF9F27" />
        <path d="M8 40 L72 40 M58 26 L72 40 L58 54" stroke="#7F77DD" stroke-width="3" />
      </svg>
      <p style="color:#EF9F27;font-size:24px;">Please rotate to landscape</p>
    </div>

    <!-- WELCOME PAGE -->
    <div class="page active" id="page-welcome">
      <div class="page-topbar" style="justify-content:flex-start;">
        <div id="connIndicator" onclick="goTo('page-settings')">
          <div id="connDot" class="disconnected"></div>
          <span id="connLabel" class="disconnected">Not Connected</span>
        </div>
      </div>
      <div style="width:100%; max-width:1400px; margin:0 auto 32px; text-align:center;">
        <div style="font-size:40px; line-height:1.2; color:#fff;">Welcome to</div>
        <div style="font-size:80px; line-height:1.2; font-weight:700; color:#fff;">Gspro Control Box 365</div>
      </div>
      <div class="welcome-grid">
        <div class="welcome-btn" onclick="goTo('page-gameplay')">Game<br>Play</div>
        <div class="welcome-btn" onclick="goTo('page-bagmapping')">Bag Mapping</div>
        <div class="welcome-btn" onclick="goTo('page-practice')">Practice</div>
        <div class="welcome-btn" onclick="goTo('page-environment')">Environment</div>

        <div class="welcome-btn quit-btn" onclick="quitApp()">Quit</div>
        <div class="welcome-btn" onclick="goTo('page-settings')">Connect<br>to PC</div>
        <div class="welcome-btn" onclick="goTo('page-obs')">OBS</div>
      </div>
      <div style="margin-top: 60px; display: flex; justify-content: space-between; align-items: flex-start; width: 100%; padding: 0 40px; align-self: flex-start;">
        <p style="font-size: 40px; color: #fff; line-height: 1.3; font-weight: 600;">
          Created by Mickeyf<br>
          email: controlbox365@outlook.com<br>
          Version 1.06
        </p>
        <div style="position: relative; flex-shrink: 0; width: 525px; height: 153px;">
          <div style="position: absolute; top: 0; right: 0; transform: scale(3); transform-origin: top right;">
            <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="controlbox365" data-color="#FFDD00" data-emoji="" data-font="[...]
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
